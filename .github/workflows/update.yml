name: Refresh sports fixtures
on:
  schedule:
    - cron: '17 3,7,11,15,19,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fetch.py'
      - 'tests/**'
      - 'data/verified-tv-*.json'
      - 'data/official-f1-sessions.json'
      - 'data/verified-fixtures.json'
      - 'sources/sources.json'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: weekend-fixtures
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector
        run: python -m unittest discover -s tests
      - name: Check fixture coverage and TV source tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Retrieve and audit sports fixtures
        run: python fetch.py
      - name: Publish fixture and source-health reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json data/source-health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated sports fixtures and source audit'
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              echo "Concurrent update detected; retrying publish ($attempt/5)"
              sleep $((attempt * 3))
            done
            echo 'Failed to publish after five attempts' >&2
            exit 1
          fi
