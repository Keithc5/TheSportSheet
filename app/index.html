<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081421"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Sport Sheet"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon.svg"><title>The Sport Sheet · App</title>
<style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#081421;color:#eef6ff}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 calc(88px + env(safe-area-inset-bottom));background:linear-gradient(145deg,#102b36,#081421 50%);min-height:100dvh}header{position:sticky;top:0;z-index:3;background:#081421ee;backdrop-filter:blur(12px);padding:16px 16px 10px;border-bottom:1px solid #294353}header .top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900;letter-spacing:-.8px;font-size:23px}.brand span{color:#a0f35c}.zone{font-size:11px;color:#b5ccda;text-align:right}h1{font-size:21px;margin:18px 16px 6px}#updated{margin:0 16px 12px;color:#9cb1c1;font-size:12px}.scroll{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}button,select{font:inherit;color:inherit;background:#152b3c;border:1px solid #345061;border-radius:12px;padding:10px 13px;cursor:pointer}button[aria-pressed=true],button.active{border-color:#9bf34f;background:#193b35;color:#c9ff96}.day{min-width:61px;display:flex;flex-direction:column;gap:2px;align-items:center}.day small{font-size:10px;color:#a5b8c8}.day .dot{width:5px;height:5px;border-radius:50%;background:#a4f65a}.day.empty .dot{background:#516273}.day.empty{opacity:.65}.day[aria-pressed=true]{opacity:1}main{padding:0 13px}#status{padding:12px 4px;color:#a6b9c9;font-size:13px}.fixture{margin:10px 0;border:1px solid #29465b;border-left:4px solid #98ef58;border-radius:15px;padding:14px;background:#112637}.fixture.rugby{border-left-color:#ffad67}.fixture.football{border-left-color:#65baff}.fixture.nfl{border-left-color:#e7ac76}.fixture.golf{border-left-color:#d2a7ff}.fixture .meta{font-size:11px;color:#a9c1cf;display:flex;justify-content:space-between;gap:8px}.fixture .name{font-size:17px;font-weight:750;margin:10px 0;line-height:1.3}.fixture .bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}.kickoff{font-weight:850;font-size:18px;color:#c8ff9a}.tv{font-size:12px;color:#b4c7d4;text-align:right;max-width:52%}.star{border:0;background:transparent;font-size:23px;padding:0 4px;color:#b2c3ce}.star.saved{color:#e8c868}.settings{margin:12px 16px;padding:16px;background:#142a39;border:1px solid #355164;border-radius:16px}.settings label{display:block;margin:12px 0 6px;font-size:13px}.settings select{width:100%}.settings p{color:#b4c8d5;font-size:12px}.hidden{display:none!important}nav.bottom{position:fixed;bottom:0;left:0;right:0;z-index:4;display:flex;justify-content:space-around;gap:3px;background:#0b1d2df5;border-top:1px solid #385268;padding:9px 8px calc(9px + env(safe-area-inset-bottom))}nav.bottom button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;font-size:11px;gap:3px;padding:7px 9px;min-width:65px}nav.bottom button[aria-pressed=true]{color:#a3f55e}nav.bottom b{font-size:21px}.empty-state{text-align:center;padding:35px 12px;color:#b3c5d3}a{color:#baf88b}</style></head>
<body><header><div class="top"><div class="brand">TheSport<span>Sheet</span></div><div class="zone" id="zoneLabel">Ireland / Dublin</div></div></header><section id="settings" class="settings hidden"><strong>Settings</strong><label for="timezone">Display fixture times in</label><select id="timezone"><option value="Europe/Dublin">Ireland / Dublin</option><option value="America/Los_Angeles">Las Vegas / Pacific</option><option value="America/New_York">New York / Eastern</option><option value="Europe/London">London</option><option value="Europe/Paris">Central Europe</option><option value="Australia/Sydney">Sydney</option><option value="Asia/Tokyo">Tokyo</option><option value="UTC">UTC</option></select><p>Times automatically account for daylight saving changes. Your favourites and timezone are shared with the browser version on this device.</p><p><a href="../">Open desktop website</a></p></section><h1 id="heading">Fixtures</h1><p id="updated"></p><div id="sports" class="scroll" aria-label="Filter by sport"></div><div id="days" class="scroll" aria-label="Choose date"></div><main><div id="status" role="status">Loading fixtures…</div><div id="fixtures"></div></main><nav class="bottom" aria-label="Sections"><button data-view="fixtures" aria-pressed="true"><b>▣</b>Fixtures</button><button data-view="results" aria-pressed="false"><b>▤</b>Results</button><button data-view="favourites" aria-pressed="false"><b>☆</b>Favourites</button><button data-view="settings" aria-pressed="false"><b>⚙</b>Settings</button></nav>
<script>
'use strict';
const FAV_KEY='thesportsheet-favourites-v1',ZONE_KEY='thesportsheet-timezone-v1',CACHE_KEY='thesportsheet-mobile-events-v1';
const zones=['Europe/Dublin','America/Los_Angeles','America/New_York','Europe/London','Europe/Paris','Australia/Sydney','Asia/Tokyo','UTC'];
const $=id=>document.getElementById(id);
let zone=localStorage.getItem(ZONE_KEY)||'Europe/Dublin';if(!zones.includes(zone))zone='Europe/Dublin';
let favourites=new Set();try{const saved=JSON.parse(localStorage.getItem(FAV_KEY)||'[]');if(Array.isArray(saved))favourites=new Set(saved)}catch{}
let events=[],view='fixtures',sport='All',dayOffset=0,loaded=false,offline=false;
const fmt=(d,opts)=>new Intl.DateTimeFormat('en-IE',{timeZone:zone,...opts}).format(d);
const dayKey=d=>{const p=new Intl.DateTimeFormat('en-GB',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);const v=Object.fromEntries(p.map(x=>[x.type,x.value]));return v.year+'-'+v.month+'-'+v.day};
const eventTime=e=>e.start_time||e.coverage_time||e.start;
const dateOf=e=>{const d=new Date(eventTime(e));return Number.isNaN(d.valueOf())?null:d};
const startConfirmed=e=>Boolean(e.start_time)&&e.verification!=='unconfirmed';
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function days(){const today=dayKey(new Date());const base=new Date(today+'T12:00:00Z');const weekday=(base.getUTCDay()+6)%7;base.setUTCDate(base.getUTCDate()-weekday+dayOffset*7);return Array.from({length:7},(_,i)=>{const d=new Date(base);d.setUTCDate(d.getUTCDate()+i);return d.toISOString().slice(0,10)})}
let selectedDay=dayKey(new Date());
function matching(){return events.filter(e=>{if(sport!=='All'&&e.sport!==sport)return false;if(view==='favourites'&&!favourites.has(e.id))return false;if(view==='results')return Boolean(e.completed);return !e.completed}).filter(e=>dateOf(e))}
function render(){
 $('timezone').value=zone;$('zoneLabel').textContent=$('timezone').selectedOptions[0].textContent;
 $('settings').classList.toggle('hidden',view!=='settings');
 $('heading').textContent=({fixtures:'Fixtures',results:'Results',favourites:'Favourites',settings:'Settings'})[view];
 document.querySelectorAll('nav.bottom button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));
 $('sports').classList.toggle('hidden',view==='settings');$('days').classList.toggle('hidden',view==='settings');
 if(view==='settings'){$('fixtures').replaceChildren();$('status').textContent='';return}
 const list=matching(),sportNames=['All',...new Set(events.map(e=>e.sport).filter(Boolean))];
 $('sports').innerHTML=sportNames.map(x=>'<button data-sport="'+escapeHtml(x)+'" aria-pressed="'+(sport===x)+'">'+escapeHtml(x)+'</button>').join('');
 const dates=days();if(!dates.includes(selectedDay))selectedDay=dates[0];
 const counts=new Map();list.forEach(e=>{const k=dayKey(dateOf(e));counts.set(k,(counts.get(k)||0)+1)});
 $('days').innerHTML='<button data-week="-1" aria-label="Previous week">‹</button>'+dates.map(d=>{const dt=new Date(d+'T12:00:00Z');return '<button class="day '+(counts.has(d)?'':'empty')+'" data-day="'+d+'" aria-pressed="'+(selectedDay===d)+'"><small>'+fmt(dt,{weekday:'short'})+'</small>'+d.slice(8)+'<span class="dot"></span></button>'}).join('')+'<button data-week="1" aria-label="Next week">›</button>';
 const selected=list.filter(e=>dayKey(dateOf(e))===selectedDay).sort((a,b)=>dateOf(a)-dateOf(b));
 $('updated').textContent=loaded?'Updated '+fmt(new Date(window.lastUpdated||Date.now()),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
 $('status').textContent=(offline?'Offline · last saved fixtures · ':'')+(selected.length?selected.length+' event'+(selected.length===1?'':'s'):'');
 $('fixtures').innerHTML=selected.length?selected.map(e=>{const d=dateOf(e),start=startConfirmed(e),time=fmt(d,{hour:'2-digit',minute:'2-digit'});return '<article class="fixture '+escapeHtml((e.sport||'').toLowerCase())+'"><div class="meta"><span>'+escapeHtml(e.sport)+' · '+escapeHtml(e.competition)+'</span><button class="star '+(favourites.has(e.id)?'saved':'')+'" data-fav="'+escapeHtml(e.id)+'" aria-label="Toggle favourite" aria-pressed="'+favourites.has(e.id)+'">'+(favourites.has(e.id)?'★':'☆')+'</button></div><div class="name">'+escapeHtml(e.name)+'</div><div class="bottom"><div class="kickoff">'+escapeHtml(time)+(start?'':' <small>TV / unconfirmed start</small>')+'</div><div class="tv">'+escapeHtml(e.channel||'TV not confirmed')+(e.completed&&e.result?' · '+escapeHtml(e.result):'')+'</div></div></article>'}).join(''):'<div class="empty-state">No '+(view==='results'?'results':'fixtures')+' found for this day and filter.</div>';
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render()}else if(b.dataset.sport){sport=b.dataset.sport;render()}else if(b.dataset.day){selectedDay=b.dataset.day;render()}else if(b.dataset.week){dayOffset+=Number(b.dataset.week);selectedDay=days()[0];render()}else if(b.dataset.fav){favourites.has(b.dataset.fav)?favourites.delete(b.dataset.fav):favourites.add(b.dataset.fav);localStorage.setItem(FAV_KEY,JSON.stringify([...favourites]));render()}});
$('timezone').addEventListener('change',e=>{zone=e.target.value;localStorage.setItem(ZONE_KEY,zone);dayOffset=0;selectedDay=dayKey(new Date());render()});
async function load(){try{const res=await fetch('../data/events.json',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(!Array.isArray(data.events))throw Error('Invalid fixture data');events=data.events;window.lastUpdated=data.updated;offline=false;localStorage.setItem(CACHE_KEY,JSON.stringify(data));loaded=true}catch(err){try{const saved=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(!Array.isArray(saved?.events))throw Error('No cached data');events=saved.events;window.lastUpdated=saved.updated;loaded=true;offline=true}catch{$('status').textContent='Unable to load fixtures. Connect to the internet and reopen the app.'}}render()}
render();load();window.addEventListener('focus',()=>{if(view!=='settings')load()});if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
